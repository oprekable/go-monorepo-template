name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  compile:
    name: Build & Lint Code
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'staging' && 'staging' || 'dev' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true

      - name: Configure private Go modules
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: github.com/{{REPO_OWNER}}/*

      - name: Do Test from root path
        run: |
          go work init
          go work use -r .
          make test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
